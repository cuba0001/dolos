[package]
name = "dolos"
version = "0.1.0"
edition = "2024"

[dependencies]
rcgen = { version = "0.13.2", features = ["x509-parser"] } # used to generate leaf cert
rustls = "0.23.38"
time = "0.3.47"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.6"
